# =====================================================================================
# CURATED DRUG CATALOG  (class + route for agents with no `therapeutic_areas:` entry)
# =====================================================================================
# Hand-authored and deliberately bounded to the Tier 1-3 comparator set. Together with
# the annotations already on the Dermatology, Gastroenterology and Rheumatology entries
# above this covers ~27 agents. It is reviewed like any other config; nothing is inferred.
#
# `administration_route` is the load-bearing field: mixing an oral small molecule with
# injectable biologics in one network is a transitivity threat, and the route label is
# what lets the resolver detect and disclose it. Where a drug has different induction
# and maintenance routes the MAINTENANCE route is recorded and the divergence noted,
# because induction and maintenance are separate networks anyway.

drug_catalog:
  Taltz:        { generic: ixekizumab,        company: Eli Lilly,          drug_class: IL-17 inhibitor,        administration_route: SC, aliases: [IXE] }
  Bimzelx:      { generic: bimekizumab,       company: UCB,                drug_class: IL-17A/F inhibitor,     administration_route: SC, aliases: [BKZ] }
  Sotyktu:      { generic: deucravacitinib,   company: Bristol Myers Squibb, drug_class: TYK2 inhibitor,       administration_route: ORAL }
  Cibinqo:      { generic: abrocitinib,       company: Pfizer,             drug_class: JAK inhibitor,          administration_route: ORAL }
  Adbry:        { generic: tralokinumab,      company: LEO Pharma,         drug_class: IL-13 inhibitor,        administration_route: SC }
  Ebglyss:      { generic: lebrikizumab,      company: Eli Lilly,          drug_class: IL-13 inhibitor,        administration_route: SC }
  Nemluvio:     { generic: nemolizumab,       company: Galderma,           drug_class: IL-31 receptor inhibitor, administration_route: SC }
  Opzelura:     { generic: ruxolitinib cream, company: Incyte,             drug_class: JAK inhibitor,          administration_route: TOPICAL }
  # Entyvio and Omvoh induce intravenously and maintain subcutaneously; the maintenance
  # route is recorded because induction and maintenance are never pooled.
  Entyvio:      { generic: vedolizumab,       company: Takeda,             drug_class: Integrin inhibitor,     administration_route: SC }
  Omvoh:        { generic: mirikizumab,       company: Eli Lilly,          drug_class: IL-23 inhibitor,        administration_route: SC }
  Zeposia:      { generic: ozanimod,          company: Bristol Myers Squibb, drug_class: S1P receptor modulator, administration_route: ORAL }
  Velsipity:    { generic: etrasimod,         company: Pfizer,             drug_class: S1P receptor modulator, administration_route: ORAL }
  Rituxan:      { generic: rituximab,         company: Genentech/Roche,    drug_class: Anti-CD20,              administration_route: IV }

  # An adalimumab biosimilar, keyed by the development code because that is what the
  # registry wrote (seen as an arm label in NCT04018599). No brand name is asserted here:
  # the code is what the trial used, and inventing the marketed-brand mapping would be an
  # unreviewed claim on top of a reviewable one.
  #
  # `biosimilar_of` is RECORDED, NOT ACTED ON. It keeps its own node by default. Whether a
  # biosimilar may share the originator's node is a clinical equivalence claim, and that
  # belongs to `biosimilar_policy` in an approved protocol — the same separation that keeps
  # dose pooling in `dose_policy` rather than in the label normaliser.
  MSB11022:     { generic: null,             company: Fresenius Kabi,     drug_class: TNF inhibitor,          administration_route: SC, biosimilar_of: Humira }

  # Investigational, so keyed by the molecule: there is no brand to key it under yet. It is
  # here for the class and route rather than for competitive tracking — an IL-17A/F Nanobody
  # given SC is exactly the kind of agent the route-mixing check needs annotated before it
  # can tell whether a network pools an oral with an injectable.
  Sonelokimab: { generic: sonelokimab,      company: MoonLake,           drug_class: IL-17A/F inhibitor,     administration_route: SC }

  # AbbVie's own discontinued Phase 2 dual-variable-domain immunoglobulin, keyed by its
  # development code because it never received an INN or a brand. Seen as an arm label in
  # NCT02349451, which compared it against adalimumab in PsA — so it enters the network as a
  # real molecule attached to the Humira node, not as noise to be filtered.
  #
  # It is curated for its CLASS AND ROUTE, not for competitive tracking. `drug_catalog:`
  # entries are assigned `is_competitor: True` by `drug_index()`, which is wrong in spirit
  # for an AbbVie asset but has no effect: competitive alerting reads `is_competitor` from
  # the scorer's own `brand_mentions` output, and `alias_index()` is built from
  # `therapeutic_areas:` only. Nothing here reaches the alert engine.
  #
  # The class is deliberately written as its own string rather than folded into "TNF
  # inhibitor". It inhibits TNF AND IL-17A, so filing it under either single class would
  # assert a class equivalence to agents that hit one target, which is exactly the
  # assumption the class-level screen exists to prevent.
  ABT-122:      { generic: null,             company: AbbVie,             drug_class: TNF/IL-17A inhibitor,   administration_route: SC }

  # Conventional synthetic DMARD. Not a brand and not a comparator we track commercially,
  # but it is the background and active-control arm in most PsA and RA trials, so leaving
  # it uncurated turns "MTX" into a junk node in networks it legitimately belongs to.
  #
  # `background_therapy` is set for exactly that reason. Methotrexate is the backbone of
  # the regimens these questions are asked about — Rinvoq's own RA indication is written
  # as "inadequate response to methotrexate" — so "after methotrexate stopped working, is
  # Rinvoq or Cosentyx the better next step?" is one comparison with its clinical context
  # attached, not a three-way. Without the flag the curation generator discarded such
  # candidates as out-of-scope and the cell stayed an unfilled gap.
  Methotrexate: { generic: methotrexate,      company: (generic),          drug_class: csDMARD,                administration_route: ORAL, aliases: [MTX], background_therapy: true }

  # --- Acute Myeloid Leukemia comparators (Venclexta's competitive field) -------------
  # AML is the one new indication whose comparators appear nowhere in `therapeutic_areas:`
  # — the Oncology block carries a CLL/lymphoma field (Calquence, Brukinsa, Gazyva,
  # Revlimid), none of which is an AML agent. Reusing it would have generated cells like
  # "Venclexta vs Brukinsa for AML", a BTK inhibitor in a disease it is not used in.
  #
  # Azacitidine is BOTH Venclexta's combination partner and the control arm it was
  # registered against (VIALE-A: azacitidine + venetoclax vs azacitidine + placebo), so it
  # is a legitimate comparator rather than an add-on to be filtered — the same distinction
  # already recorded for Tremfya. It is NOT marked `background_therapy`: unlike
  # methotrexate it is the thing being compared, not the backbone a comparison happens on.
  #
  # Vidaza and Onureg are the same molecule by different routes and are deliberately
  # separate entries: the injectable induction agent and the oral maintenance agent are
  # not interchangeable, and `administration_route` is what lets the route-mixing check
  # see the difference.
  Vidaza:       { generic: azacitidine,        company: Bristol Myers Squibb, drug_class: Hypomethylating agent, administration_route: SC, aliases: [AZA] }
  Onureg:       { generic: oral azacitidine,   company: Bristol Myers Squibb, drug_class: Hypomethylating agent, administration_route: ORAL }
  Tibsovo:      { generic: ivosidenib,         company: Servier,            drug_class: IDH1 inhibitor,         administration_route: ORAL }
  Rydapt:       { generic: midostaurin,        company: Novartis,           drug_class: FLT3 inhibitor,         administration_route: ORAL }
