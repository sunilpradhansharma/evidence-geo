# =====================================================================================
# DISEASE OVERLAY  (additive — nothing above changes, no migration)
# =====================================================================================
# Why this exists: a focus brand does NOT map to exactly one therapeutic area. Rinvoq
# spans Rheumatology (RA, PsA, AS, nr-axSpA) and Immunology (AD, UC, CD); Humira spans
# both too. Reading competitors at therapeutic-area-block level therefore scored a
# Rinvoq Atopic Dermatitis question against Xeljanz and Olumiant while omitting Cibinqo,
# Adbry and Ebglyss. The disease is the correct unit of competitive comparison.
#
# Field contract per entry:
#   area                   parent therapeutic area (display rollup)
#   therapeutic_area_key   the STORED `therapeutic_area` value a question in this
#                          disease should carry. Must be a key of `therapeutic_areas:`.
#   brands                 monitored/focus brands approved or in play for this disease
#   competitors            the disease-specific competitive field. NOT the union of the
#                          parent area's competitors — that flattening is the bug.
#   canonical_outcomes     REFERENCES into canonical_outcomes.yaml. Never defines an
#                          endpoint. An ID that does not exist there is a startup error.
#   aliases                extra free-text spellings used only to detect the disease in
#                          a query. Kept out of `therapeutic_areas:` so alias_index()
#                          (which Prompt Volume reads) keeps its exact current output.
#
# Coverage is the 9 indications of the Rinvoq/Skyrizi evidence programme, in the four
# delivery tiers ordered by endpoint cleanliness (Hidradenitis Suppurativa joined with the
# Dermatology split and sits outside those tiers), plus 10 further indications covering
# every remaining AbbVie focus brand.
#
# Those 10 are MONITORING scope, not evidence-programme scope. They exist so the
# comparison-coverage matrix and disease-level scoring work for Imbruvica, Venclexta,
# Vraylar and Lupron; they are NOT enrolled in trial ingestion, because that is gated on
# `evidence_depth: full`, which remains Rinvoq, Skyrizi, Humira and Tremfya only.

indications:
  # --- Tier 1 -----------------------------------------------------------------------
  Plaque Psoriasis:
    area: Dermatology
    therapeutic_area_key: Dermatology
    aliases: [PsO, psoriasis, plaque psoriasis, chronic plaque psoriasis]
    brands: [Skyrizi, Humira]
    competitors: [Tremfya, Stelara, Cosentyx, Taltz, Bimzelx, Sotyktu, Otezla, Enbrel]
    canonical_outcomes: [PSO_PASI75_W16, PSO_PASI90_W16, PSO_PASI100_W16]

  Rheumatoid Arthritis:
    area: Rheumatology
    therapeutic_area_key: Rheumatology
    aliases: [RA, rheumatoid arthritis]
    brands: [Rinvoq, Humira]
    competitors: [Xeljanz, Olumiant, Enbrel, Orencia, Actemra, Cimzia, Simponi, Rituxan]
    canonical_outcomes: [RA_ACR20_W12, RA_ACR50_W12, RA_ACR70_W12]

  # --- Tier 2 -----------------------------------------------------------------------
  # The only network shared by both focus brands, and the sharpest test of the fix.
  Psoriatic Arthritis:
    area: Rheumatology
    therapeutic_area_key: Rheumatology
    aliases: [PsA, psoriatic arthritis]
    brands: [Rinvoq, Skyrizi, Humira]
    competitors: [Tremfya, Cosentyx, Taltz, Stelara, Otezla, Enbrel, Simponi, Bimzelx]
    canonical_outcomes: [PSA_ACR20_W16, PSA_ACR50_W16, PSA_PASI90_W16]

  Atopic Dermatitis:
    area: Dermatology
    therapeutic_area_key: Dermatology
    aliases: [atopic dermatitis, atopic eczema]
    brands: [Rinvoq]
    competitors: [Dupixent, Cibinqo, Adbry, Ebglyss, Nemluvio, Opzelura]
    canonical_outcomes: [AD_EASI75_W16, AD_EASI90_W16, AD_IGA01_W16]

  # --- Tier 3 -----------------------------------------------------------------------
  # Induction and maintenance are separate canonical outcomes; `dose_policy` is decisive
  # here because both focus brands use different induction and maintenance dosing.
  Ulcerative Colitis:
    area: Gastroenterology
    therapeutic_area_key: Gastroenterology
    aliases: [UC, ulcerative colitis]
    brands: [Rinvoq, Skyrizi, Humira]
    competitors: [Tremfya, Stelara, Entyvio, Zeposia, Omvoh, Velsipity, Xeljanz]
    canonical_outcomes:
      [UC_REMISSION_INDUCTION_W8, UC_ENDOSCOPIC_IMPROVEMENT_INDUCTION_W8, UC_REMISSION_MAINTENANCE_W52]

  Crohn's Disease:
    area: Gastroenterology
    therapeutic_area_key: Gastroenterology
    aliases: [CD, Crohn's disease, Crohns disease, Crohn disease]
    brands: [Skyrizi, Rinvoq, Humira]
    competitors: [Tremfya, Stelara, Entyvio, Omvoh]
    canonical_outcomes:
      [CD_REMISSION_INDUCTION_W12, CD_ENDOSCOPIC_RESPONSE_INDUCTION_W12, CD_REMISSION_MAINTENANCE_W52]

  # --- Tier 4 -----------------------------------------------------------------------
  # Sparse networks and lower arm-level availability — expect structured evidence gaps.
  Ankylosing Spondylitis:
    area: Rheumatology
    therapeutic_area_key: Rheumatology
    aliases: [ankylosing spondylitis, radiographic axial spondyloarthritis]
    brands: [Rinvoq, Humira]
    competitors: [Cosentyx, Taltz, Enbrel, Simponi, Cimzia, Bimzelx]
    canonical_outcomes: [AS_ASAS40_W14]

  Non-radiographic Axial Spondyloarthritis:
    area: Rheumatology
    therapeutic_area_key: Rheumatology
    aliases: [nr-axSpA, nraxspa, non-radiographic axial spondyloarthritis, axSpA]
    brands: [Rinvoq]
    competitors: [Cosentyx, Taltz, Cimzia, Bimzelx]
    canonical_outcomes: [NRAXSPA_ASAS40_W14]

  # --- Dermatology, beyond the original Rinvoq/Skyrizi programme --------------------
  # Humira only: Skyrizi is NOT approved in HS, so listing it here would assert an
  # indication AbbVie does not hold. Cosentyx (2023) and Bimzelx (2024) are the two
  # approved biologic comparators; both are already curated in `drug_catalog:`.
  # HiSCR50 at week 12 is the field's standard primary endpoint (PIONEER I/II).
  Hidradenitis Suppurativa:
    area: Dermatology
    therapeutic_area_key: Dermatology
    aliases: [HS, hidradenitis suppurativa, acne inversa]
    brands: [Humira]
    competitors: [Cosentyx, Bimzelx]
    canonical_outcomes: [HS_HISCR50_W12]

  # --- Beyond the immunology programme ----------------------------------------------
  # REQUIRES MEDICAL SIGN-OFF, like the endpoints they reference.
  #
  # Why these exist: the comparison-coverage matrix (`curation/coverage.py`) is built from
  # THIS block, not from `therapeutic_areas:`. It skips any disease with no declared
  # competitive field, so before these entries Imbruvica, Venclexta, Vraylar, Lupron Depot
  # and Lupron Depot-Ped produced exactly ZERO monitorable comparisons while still being
  # offered in the UI's brand picker — a filter that silently reported "no gaps".
  #
  # Each field is curated PER DISEASE, not inherited from the parent area. The Oncology
  # block carries one flat list across four diseases and the Neuroscience block one flat
  # list across three; inheriting either would reproduce the exact flattening this overlay
  # was built to fix. Where an agent is dropped from an area list, the reason is stated —
  # a silent omission is indistinguishable from an oversight.

  # --- Oncology: Imbruvica, Venclexta -----------------------------------------------
  Chronic Lymphocytic Leukemia:
    area: Oncology
    therapeutic_area_key: Oncology
    # SLL is included: iwCLL treats CLL and small lymphocytic lymphoma as one disease with
    # two presentations, and the trials enrol them together.
    aliases: [CLL, chronic lymphocytic leukemia, chronic lymphocytic leukaemia, SLL, small lymphocytic lymphoma]
    brands: [Imbruvica, Venclexta]
    # Revlimid is dropped from the area list: it is not a standard-of-care CLL comparator.
    competitors: [Calquence, Brukinsa, Gazyva, Rituxan]
    canonical_outcomes: [CLL_ORR_W48]

  Mantle Cell Lymphoma:
    area: Oncology
    therapeutic_area_key: Oncology
    aliases: [MCL, mantle cell lymphoma]
    brands: [Imbruvica]
    # Gazyva is dropped: its role is in CLL and follicular lymphoma, not MCL.
    competitors: [Calquence, Brukinsa, Revlimid, Rituxan]
    canonical_outcomes: [MCL_ORR_W24]

  Waldenstrom's Macroglobulinemia:
    area: Oncology
    therapeutic_area_key: Oncology
    aliases: [WM, Waldenstrom's Macroglobulinemia, Waldenstrom macroglobulinemia,
              Waldenstroms macroglobulinemia, Waldenstrom macroglobulinaemia,
              lymphoplasmacytic lymphoma]
    brands: [Imbruvica]
    # Calquence is DROPPED here although it is a BTK inhibitor like Imbruvica and Brukinsa:
    # it holds no Waldenstrom indication. Same class is not the same competitive field.
    competitors: [Brukinsa, Rituxan]
    canonical_outcomes: [WM_MAJOR_RESPONSE_W48]

  Acute Myeloid Leukemia:
    area: Oncology
    therapeutic_area_key: Oncology
    aliases: [AML, acute myeloid leukemia, acute myeloid leukaemia,
              acute myelogenous leukemia]
    brands: [Venclexta]
    # None of the area-level competitors appears here — see the `drug_catalog:` note. All
    # four of these are new curated entries.
    competitors: [Vidaza, Tibsovo, Rydapt, Onureg]
    canonical_outcomes: [AML_CR_CRI_W24]

  # --- Neuroscience: Vraylar --------------------------------------------------------
  Schizophrenia:
    area: Neuroscience
    therapeutic_area_key: Neuroscience
    aliases: [schizophrenia]
    brands: [Vraylar]
    # The one indication where the whole area list genuinely applies: all six are approved
    # in schizophrenia. Stated explicitly so it reads as a decision, not a copy-paste.
    competitors: [Rexulti, Caplyta, Abilify, Latuda, Seroquel, Zyprexa]
    canonical_outcomes: [SCZ_PANSS_RESPONSE_W6]

  Bipolar I Disorder:
    area: Neuroscience
    therapeutic_area_key: Neuroscience
    # No bare "bipolar depression" alias, and deliberately no bare "depression" anywhere in
    # this file — `resolve_disease` takes the LONGEST matching alias, so "depression" would
    # outrank "bipolar" and route every bipolar-depression question to MDD.
    aliases: [bipolar, bipolar I, bipolar 1, bipolar disorder, bipolar I disorder,
              bipolar 1 disorder, manic episode]
    brands: [Vraylar]
    # Rexulti is DROPPED: approved in schizophrenia, adjunctive MDD and Alzheimer's
    # agitation, but it holds no bipolar I indication.
    competitors: [Caplyta, Latuda, Seroquel, Zyprexa, Abilify]
    canonical_outcomes: [BPI_YMRS_RESPONSE_W3]

  Major Depressive Disorder:
    area: Neuroscience
    therapeutic_area_key: Neuroscience
    aliases: [MDD, major depressive disorder, major depression]
    brands: [Vraylar]
    # ADJUNCTIVE MDD only, which is the setting Vraylar is approved in. Latuda and Zyprexa
    # are dropped (bipolar depression and the olanzapine/fluoxetine combination are
    # different indications). Seroquel is dropped as the ARGUABLE case — quetiapine XR does
    # carry an adjunctive MDD indication — and is flagged here rather than quietly
    # included, because including it widens every generated MDD comparison.
    competitors: [Rexulti, Abilify, Caplyta]
    canonical_outcomes: [MDD_MADRS_RESPONSE_W6]

  # --- Women's Health: Lupron Depot -------------------------------------------------
