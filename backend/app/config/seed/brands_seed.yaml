    focus_brands:
      - name: Vraylar
        generic: cariprazine
        company: AbbVie
        indications: [Schizophrenia, Bipolar I Disorder, Major Depressive Disorder]
    competitors:
      - name: Rexulti
        generic: brexpiprazole
        company: Otsuka/Lundbeck
      - name: Caplyta
        generic: lumateperone
        company: Johnson & Johnson
      - name: Abilify
        generic: aripiprazole
        company: Otsuka
      - name: Latuda
        generic: lurasidone
        company: Sumitomo Pharma
      - name: Seroquel
        generic: quetiapine
