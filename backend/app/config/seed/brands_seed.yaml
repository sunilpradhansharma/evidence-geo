        administration_route: SC
      - name: Orencia
        generic: abatacept
        company: Bristol Myers Squibb
        drug_class: T-cell costimulation modulator
        administration_route: SC
        aliases: [ABA]
      - name: Actemra
        generic: tocilizumab
        company: Genentech/Roche
        drug_class: IL-6 inhibitor
        administration_route: SC
      - name: Olumiant
        generic: baricitinib
        company: Eli Lilly
        drug_class: JAK inhibitor
        administration_route: ORAL
        aliases: [BAR]
      - name: Cosentyx
        generic: secukinumab
        company: Novartis
        drug_class: IL-17 inhibitor
        administration_route: SC
