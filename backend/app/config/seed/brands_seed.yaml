# Brand & competitor context — kept exclusively in config (SE-007: code is content-agnostic).
# Used to inject context into the scoring prompt.
#
# Two top-level blocks, and they answer different questions:
#
#   therapeutic_areas:  the STORED grouping. `therapeutic_area` values on questions and
#                       responses are keys of this block, so it is never restructured —
#                       doing so would orphan historical rows.
#   indications:        an ADDITIVE disease overlay (see the bottom of this file). It is
#                       what makes a Rinvoq Atopic Dermatitis question resolve to AD
#                       competitors instead of the whole Dermatology block. Zero migration:
#                       nothing reads it unless it asks for a disease.
#
# Three curated annotations appear on drug entries, all hand-authored and bounded to the
# ~20-30 agents that matter for the Rinvoq/Skyrizi evidence programme:
#
#   drug_class / administration_route
#       Reviewed config, not inferred. Open-set class inference (RxNorm/ATC/ChEMBL) is
#       deliberately out of scope — a curated table is a reviewable artefact, an inferred
#       label is an unreviewed assertion. `administration_route` feeds the route-mixing
#       transitivity check when oral small molecules share a network with injectables.
#   evidence_depth  (default "standard")
#       `full` means "ingest trials, build networks, compute comparisons for this drug".
#       It is read ONLY by the evidence layer. It does NOT change monitoring identity:
#       a competitor at full depth stays a competitor to scoring and alerting, so the
#       COMPETITOR_ADVANTAGE signal is preserved. Promoting such a drug into
#       focus_brands would silently suppress that alert (alert_engine skips the focus
#       brand) — which is why depth and side are separate fields.
#       Always an explicit opt-in, focus brands included: defaulting focus brands to
#       full would enrol Lupron, Vraylar and the GLP-1 set in the evidence programme by
#       accident. Currently full: Rinvoq, Skyrizi, Humira, Tremfya.
#   background_therapy  (default false, `drug_catalog:` only)
#       "This agent may be NAMED in a generated head-to-head question without changing
#       which comparison that question asks." A curated question may otherwise name only
#       the two agents of its own cell, because a third drug makes it a different
#       comparison from the one that was requested — see `curation/generator.py`.
#       An explicit opt-in, and deliberately NOT inferred from which block a drug sits
#       in: `drug_catalog:` holds genuine commercial rivals (Taltz, Bimzelx, Entyvio)
#       beside annotation-only agents, so "catalog means harmless" would quietly let a
#       real competitor into a question. It is also NOT the same claim as "not a
#       competitor": an investigational or unbranded biosimilar agent is not a rival
#       either, but naming one in a patient-facing question is worse, not better, so
#       those stay policed. Currently true for: Methotrexate.

therapeutic_areas:
  # Dermatology and Gastroenterology replaced the single "Immunology" key. One flat
  # immunology block put Plaque Psoriasis next to Ulcerative Colitis, so a brand-less
  # skin question fell back to a competitor list containing Entyvio. Specialty is the
  # unit clinicians, congresses and Medical Affairs teams actually work in, so it is
  # the unit the stored `therapeutic_area` key uses.
  #
  # Humira, Skyrizi and Rinvoq now appear in THREE blocks (Dermatology,
  # Gastroenterology, Rheumatology). Each copy repeats `aliases`, `drug_class`,
  # `administration_route` and `evidence_depth` verbatim — `drug_index()` and
  # `alias_index()` take whichever block they read FIRST, so an omission here would
  # make the resolved drug facts depend on YAML ordering. Only `indications:` differs
  # per block, because that is the one field that is genuinely area-specific.
  Dermatology:
    area: Dermatology
    focus_brands:
      - name: Skyrizi
        generic: risankizumab
        company: AbbVie
        evidence_depth: full
        drug_class: IL-23 inhibitor
        administration_route: SC
        aliases: [RZB]
        indications: [Plaque Psoriasis]
      - name: Humira
        generic: adalimumab
        company: AbbVie
        evidence_depth: full
        drug_class: TNF inhibitor
        administration_route: SC
        # ADA is adalimumab in an ARM TITLE. Note for reviewers: in an *outcome* title the
        # same three letters usually mean anti-drug antibodies. Aliases are only ever
        # applied to treatment labels, so the collision is out of scope here.
        aliases: [ADA]
        indications: [Plaque Psoriasis, Hidradenitis Suppurativa]
      - name: Rinvoq
        generic: upadacitinib
        company: AbbVie
        evidence_depth: full
        drug_class: JAK inhibitor
        administration_route: ORAL
        aliases: [UPA]
        indications: [Atopic Dermatitis]
    competitors:
      - name: Stelara
        generic: ustekinumab
        company: Johnson & Johnson
        drug_class: IL-12/23 inhibitor
        administration_route: SC
      - name: Dupixent
        generic: dupilumab
        company: Sanofi/Regeneron
        drug_class: IL-4/13 inhibitor
        administration_route: SC
      # Carried at FULL evidence depth: a third evidence programme in its own right
      # (VOYAGE, DISCOVER, QUASAR, GALAXI/GRAVITI) across four indications. Still a
      # competitor everywhere else — see the header note.
      - name: Tremfya
        generic: guselkumab
        company: Johnson & Johnson
        evidence_depth: full
        drug_class: IL-23 inhibitor
        administration_route: SC
        aliases: [GUS]
        indications: [Plaque Psoriasis]
      - name: Cosentyx
        generic: secukinumab
        company: Novartis
        drug_class: IL-17 inhibitor
        administration_route: SC
        aliases: [SEC]
      - name: Enbrel
        generic: etanercept
        company: Amgen
        drug_class: TNF inhibitor
        administration_route: SC
      - name: Otezla
        generic: apremilast
        company: Amgen
        drug_class: PDE4 inhibitor
        administration_route: ORAL

  Gastroenterology:
    area: Gastroenterology
    focus_brands:
      - name: Skyrizi
        generic: risankizumab
        company: AbbVie
        evidence_depth: full
        drug_class: IL-23 inhibitor
        administration_route: SC
        aliases: [RZB]
        indications: [Crohn's Disease, Ulcerative Colitis]
      - name: Rinvoq
        generic: upadacitinib
        company: AbbVie
        evidence_depth: full
        drug_class: JAK inhibitor
        administration_route: ORAL
        aliases: [UPA]
        indications: [Ulcerative Colitis, Crohn's Disease]
      - name: Humira
        generic: adalimumab
        company: AbbVie
        evidence_depth: full
        drug_class: TNF inhibitor
        administration_route: SC
        aliases: [ADA]
        indications: [Crohn's Disease, Ulcerative Colitis]
    competitors:
      - name: Tremfya
        generic: guselkumab
        company: Johnson & Johnson
        evidence_depth: full
        drug_class: IL-23 inhibitor
        administration_route: SC
        aliases: [GUS]
        indications: [Ulcerative Colitis, Crohn's Disease]
      - name: Stelara
        generic: ustekinumab
        company: Johnson & Johnson
        drug_class: IL-12/23 inhibitor
        administration_route: SC
      # Entyvio and Omvoh are the GI-specific field the old flat Immunology block never
      # carried at area level — a brand-less Crohn's question previously fell back to a
      # competitor list of psoriasis biologics. Both induce intravenously and maintain
      # subcutaneously; the MAINTENANCE route is recorded, matching `drug_catalog:`.
      - name: Entyvio
        generic: vedolizumab
        company: Takeda
        drug_class: Integrin inhibitor
        administration_route: SC
      - name: Omvoh
        generic: mirikizumab
        company: Eli Lilly
        drug_class: IL-23 inhibitor
        administration_route: SC

  Oncology:
    area: Oncology
    focus_brands:
      - name: Imbruvica
        generic: ibrutinib
        company: AbbVie
        indications: [Chronic Lymphocytic Leukemia, Mantle Cell Lymphoma, Waldenstrom's Macroglobulinemia]
      - name: Venclexta
        generic: venetoclax
        company: AbbVie
        indications: [Chronic Lymphocytic Leukemia, Acute Myeloid Leukemia]
    competitors:
      - name: Calquence
        generic: acalabrutinib
        company: AstraZeneca
      - name: Brukinsa
        generic: zanubrutinib
        company: BeiGene
      - name: Gazyva
        generic: obinutuzumab
        company: Roche
      - name: Revlimid
        generic: lenalidomide
        company: Bristol Myers Squibb

  Central Precocious Puberty:
    area: Endocrinology
    focus_brands:
      - name: Lupron Depot-Ped
        generic: leuprolide acetate
        company: AbbVie
        indications: [Central Precocious Puberty]
    competitors:
      - name: Supprelin LA
        generic: histrelin acetate
        company: Endo Pharmaceuticals
      - name: Fensolvi
        generic: leuprolide acetate
        company: Tolmar
      - name: Triptodur
        generic: triptorelin
        company: Arbor Pharmaceuticals

  Endometriosis:
    area: "Women's Health"
    focus_brands:
      - name: Lupron Depot
        generic: leuprolide acetate
        company: AbbVie
        indications: [Endometriosis]
    competitors:
      - name: Orilissa
        generic: elagolix
        company: AbbVie
      - name: Myfembree
        generic: relugolix/estradiol/norethindrone
        company: Pfizer/Myovant
      - name: Zoladex
        generic: goserelin
        company: AstraZeneca
      - name: Synarel
        generic: nafarelin
        company: Pfizer

  Uterine Fibroids:
    area: "Women's Health"
    focus_brands:
      - name: Lupron Depot
        generic: leuprolide acetate
        company: AbbVie
        indications: [Uterine Fibroids]
    competitors:
      - name: Oriahnn
        generic: elagolix/estradiol/norethindrone
        company: AbbVie
      - name: Myfembree
        generic: relugolix/estradiol/norethindrone
        company: Pfizer/Myovant
      - name: Zoladex
        generic: goserelin
        company: AstraZeneca

  Rheumatology:
    area: Rheumatology
    focus_brands:
      # Aliases are repeated on both copies of these two drugs on purpose. The index takes
      # whichever block it reads first, so omitting them here would make the resolved node
      # depend on YAML ordering — the exact class of disagreement flagged above.
      - name: Rinvoq
        generic: upadacitinib
        company: AbbVie
        evidence_depth: full
        drug_class: JAK inhibitor
        administration_route: ORAL
        aliases: [UPA]
        indications: [Rheumatoid Arthritis, Psoriatic Arthritis, Ankylosing Spondylitis, Non-radiographic Axial Spondyloarthritis]
      - name: Humira
        generic: adalimumab
        company: AbbVie
        evidence_depth: full
        drug_class: TNF inhibitor
        administration_route: SC
        aliases: [ADA]
        indications: [Rheumatoid Arthritis, Psoriatic Arthritis, Ankylosing Spondylitis, Juvenile Idiopathic Arthritis]
    competitors:
      - name: Enbrel
        generic: etanercept
        company: Amgen
        drug_class: TNF inhibitor
        administration_route: SC
      - name: Xeljanz
        generic: tofacitinib
        company: Pfizer
        drug_class: JAK inhibitor
        administration_route: ORAL
        aliases: [TOF]
      - name: Cimzia
        generic: certolizumab pegol
        company: UCB
        drug_class: TNF inhibitor
        administration_route: SC
      - name: Simponi
        generic: golimumab
        company: Johnson & Johnson
