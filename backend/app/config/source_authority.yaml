# Source Authority taxonomy (FR-706a) — the SOURCE OF TRUTH for classifying a cited
# domain. Content-agnostic infrastructure (SE-007): brand/competitor *ownership* is derived
# dynamically from brands.yaml (see source_authority/taxonomy.py); this file holds the
# TA-independent, third-party authority lists + a few explicit ownership domains that a
# brand-name match can't infer (corporate/company sites).
#
# Two INDEPENDENT dimensions are modelled (see classifier.py):
#   control_type   : who owns/controls the domain  (ABBVIE | COMPETITOR | INDEPENDENT | UNKNOWN)
#   authority_type : the content/authority class    (REGULATORY | PEER_REVIEWED | ...)
# The lists below drive authority_type via LONGEST-SUFFIX matching, so a specific
# subdomain rule (ncbi.nlm.nih.gov) wins over a broad parent (nih.gov).
#
# Bump rules_version whenever the lists change materially — cached domain classifications
# stamped with an older version can then be recognised as stale and reclassified.
rules_version: 5

# ---------------------------------------------------------------------------
# authority_type lists (independent third parties). Entries are authority domains;
# longest match wins. Keep entries lowercase, no scheme, no www.
# ---------------------------------------------------------------------------
regulatory:
  - fda.gov
  - ema.europa.eu
  - ec.europa.eu
  - who.int
  - cdc.gov
  - nih.gov            # broad; peer_reviewed subdomains below win via longest-suffix
  - clinicaltrials.gov
  - mhra.gov.uk
  - tga.gov.au
  - hc-sc.gc.ca
  - pmda.go.jp
  - health.gov
  - hhs.gov
  - accessdata.fda.gov
  - dailymed.nlm.nih.gov
  - nhs.uk
  - bccancer.bc.ca
  - hpra.ie             # Ireland
  - bfarm.de            # Germany
  - ansm.sante.fr       # France
  - aemps.gob.es        # Spain
  - aifa.gov.it         # Italy
  - swissmedic.ch       # Switzerland
  - mfds.go.kr          # South Korea
  - anvisa.gov.br       # Brazil
  - medsafe.govt.nz     # New Zealand

# Clinical-practice guidelines + health-technology-assessment (HTA) bodies. Kept SEPARATE from
# regulatory AGENCIES (FDA/EMA) because guideline/HTA output drives treatment decisions and is a
# distinct authority class. Still a TRUSTED category (see classifier.py / service _TRUSTED_CATS).
guideline:
  - nccn.org
  - esmo.org
  - nice.org.uk         # UK HTA (moved from regulatory)
  - cda-amc.ca          # Canada's Drug Agency / HTA (moved from regulatory)
