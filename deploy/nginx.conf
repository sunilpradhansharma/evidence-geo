# nginx server block for the single-container deployment.
#
# Serves the static React build and reverse-proxies the API to uvicorn.
# The /api/ prefix is stripped before forwarding (proxy_pass has a trailing
# slash) so the backend keeps its root-level routes (/runs, /health, ...) -
# exactly like the Vite dev proxy does locally.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling; the API takes JSON, not large files.
    client_max_body_size 16m;

    # ---- Static SPA ----
    # Serve the requested file if it exists, otherwise fall back to index.html
    # so client-side (react-router) routes like /runs or /compare work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API ----
    # /api/runs -> http://127.0.0.1:8000/runs   (the /api/ prefix is dropped)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM runs can take a while; keep upstream timeouts generous.
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- Health check for the deploy smoke-test ----
    # Maps the conventional /healthz to the backend's /health endpoint.
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
