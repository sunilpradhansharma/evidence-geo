; Supervisor program definitions for the single-container deployment.
; Included by /etc/supervisor/supervisord.conf via [include] files=conf.d/*.conf.
;
; Runs uvicorn (FastAPI backend) and nginx (static + reverse proxy) side by
; side, restarting either if it dies, and forwarding both logs to the
; container's stdout/stderr so they show up in `docker logs`.

[program:uvicorn]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Give uvicorn priority so the backend is up before nginx starts proxying.
priority=10

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
